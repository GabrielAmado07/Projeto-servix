<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro Servix</title>
  <link rel="stylesheet" href="Css/Cadastro.css">
  <link rel="stylesheet" href="Css/modern-effects.css">
  <link rel="icon" type="image/jpeg" href="Projeto-servix/img/IMG-20260416-WA0658.jpg">
</head>

<body>
  <main class="cadastro-container">
    <!-- Capa do site com a logo/imagem da Servix -->
    <aside class="cadastro-cover" aria-label="Capa Servix"
      style="background-image: url('img/51b134c0-a354-4dea-8a5d-c7e31a5b9e07_1617792012.jpeg');">
      <div class="cover-overlay">
        <img src="Projeto-servix/img/IMG-20260416-WA0658.jpg" alt="Logo da Servix" class="cover-icon">
        <h2>Servix</h2>
        <p>Encontre serviços com facilidade e segurança.</p>
      </div>
    </aside>
    
    <section class="cadastro-card">
      <div class="brand-area">
        <img src="Projeto-servix/img/IMG-20260416-WA0658.jpg" alt="Logo da Servix" class="brand-logo">
        <h1>Servix</h1>
      </div>
      <p class="cadastro-subtitulo">
        Crie sua conta e publique um serviço para encontrar novos clientes.
      </p>

      <!-- FORMULÁRIO DE CADASTRO -->
      <form class="cadastro-form" id="form-cadastro">
        
        <div class="form-group">
          <label for="nome">Nome Completo</label>
          <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
        </div>

        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" placeholder="Crie uma senha forte" minlength="6" required>
        </div>

        <div class="service-form-heading">
          <h2>Seu serviço</h2>
          <p>Preencha os dados abaixo para publicar uma oferta no marketplace.</p>
        </div>

        <div class="form-group">
          <label for="servico-titulo">Título do serviço</label>
          <input type="text" id="servico-titulo" name="servico-titulo" placeholder="Ex.: Instalação elétrica residencial" required>
        </div>

        <div class="form-group">
          <label for="servico-descricao">Descrição</label>
          <textarea id="servico-descricao" name="servico-descricao" placeholder="Explique o que você oferece" rows="4" required></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="servico-categoria">Categoria</label>
            <select id="servico-categoria" name="servico-categoria" required>
              <option value="">Carregando categorias...</option>
            </select>
            <button type="button" class="btn-link-categoria" id="mostrar-nova-categoria">+ Criar nova categoria</button>
            <div class="nova-categoria" id="nova-categoria" hidden>
              <label for="servico-nova-categoria">Nome da nova categoria</label>
              <div class="nova-categoria-row">
                <input type="text" id="servico-nova-categoria" maxlength="80" placeholder="Ex.: Jardinagem">
                <button type="button" class="btn-confirmar-categoria" id="criar-categoria">Adicionar</button>
              </div>
            </div>
          </div>

          <div class="form-group">
            <label for="servico-preco">Preço estimado</label>
            <input type="number" id="servico-preco" name="servico-preco" min="0" step="0.01" placeholder="150,00" required>
          </div>
        </div>

        <div class="form-group">
          <label for="servico-detalhe">Detalhe do preço</label>
          <input type="text" id="servico-detalhe" name="servico-detalhe" placeholder="Ex.: valor por visita">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="servico-foto">URL da foto</label>
            <input type="url" id="servico-foto" name="servico-foto" placeholder="https://...">
          </div>

          <div class="form-group">
            <label for="servico-whatsapp">WhatsApp</label>
            <input type="tel" id="servico-whatsapp" name="servico-whatsapp" placeholder="(21) 99999-9999">
          </div>
        </div>

        <button type="submit" class="btn-cadastro" id="btn-cadastrar">Criar Conta</button>
        
      </form>
      <!-- FIM DO FORMULÁRIO -->

      <p class="login-texto">
        Já tem uma conta?
        <a href="Servix.html">Entrar</a>
      </p>
    </section>
  </main>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/env-config.js"></script>
  <script type="module" src="JavaScript/main.js"></script>
</body>

</html>
