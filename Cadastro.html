<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro Servix</title>
  <link rel="stylesheet" href="Css/Cadastro.css">
  <link rel="stylesheet" href="Css/modern-effects.css">
  <link rel="icon" type="image/jpeg" href="img/Logo icone.jpeg">
</head>

<body>
  <main class="cadastro-container">
    <!-- Capa do site com a logo/imagem da Servix -->
    <aside class="cadastro-cover" aria-label="Capa Servix"
      style="background-image: url('img/51b134c0-a354-4dea-8a5d-c7e31a5b9e07_1617792012.jpeg');">
      <div class="cover-overlay">
        <img src="img/Logo icone.jpeg" alt="Logo da Servix" class="cover-icon">
        <h2>Servix</h2>
        <p>Encontre serviços com facilidade e segurança.</p>
      </div>
    </aside>

    <section class="cadastro-card">
      <div class="brand-area">
        <img src="img/Logo icone.jpeg" alt="Logo da Servix" class="brand-logo">
        <h1>Servix</h1>
      </div>
      <p class="cadastro-subtitulo">
        Crie sua conta para acessar a Servix.
      </p>

      <!-- FORMULÁRIO DE CADASTRO -->
      <form class="cadastro-form" id="form-cadastro">

        <div class="form-group">
          <label for="nome">Nome Completo</label>
          <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
        </div>

        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" placeholder="Crie uma senha forte" minlength="6" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" name="telefone" placeholder="(11) 99999-9999" required>
          </div>

          <div class="form-group">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" name="cpf" maxlength="14" placeholder="000.000.000-00" required>
          </div>
        </div>

        <div class="form-group">
          <label for="endereco">Endereço</label>
          <input type="text" id="endereco" name="endereco" placeholder="Rua, número, bairro, complemento" required>
        </div>

        <div class="form-group">
          <label for="cep">CEP</label>
          <input type="text" id="cep" name="cep" maxlength="9" inputmode="numeric" autocomplete="postal-code" placeholder="00000-000" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="cidade">Cidade</label>
            <input type="text" id="cidade" name="cidade" placeholder="Sua cidade" required>
          </div>

          <div class="form-group">
            <label for="estado">Estado</label>
            <input type="text" id="estado" name="estado" maxlength="2" placeholder="SP" required>
          </div>
        </div>

        <div class="form-group">
          <label for="avatar-arquivo">Foto de avatar</label>
          <input type="file" id="avatar-arquivo" accept="image/*">
          <input type="url" id="avatar-url" name="avatar-url" placeholder="Ou cole a URL da imagem">

          <div class="foto-preview-wrapper" id="avatar-preview-wrapper" style="margin-top: 12px; display: none;">
            <img id="avatar-preview" alt="Pré-visualização do avatar" class="servico-foto-preview" style="max-width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 2px solid #dfeafc; background: #f5f8ff;">
          </div>
        </div>

        <button type="submit" class="btn-cadastro" id="btn-cadastrar">Criar Conta</button>

      </form>
      <!-- FIM DO FORMULÁRIO -->

      <p class="login-texto">
        Já tem uma conta?
        <a href="Servix.html">Entrar</a>
      </p>
      <p class="login-texto">
        Já possui conta? <a href="publicar-servico.html">Publicar serviço</a>
      </p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="env-config.js"></script>
  <script src="JavaScript/main.js"></script>
</body>

</html>
