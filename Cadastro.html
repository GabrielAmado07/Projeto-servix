<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro Servix</title>
  <link rel="stylesheet" href="Css/Cadastro.css">
  <link rel="stylesheet" href="Css/modern-effects.css">
  <link rel="icon" type="image/jpeg" href="Projeto-servix/img/IMG-20260416-WA0658.jpg">
</head>

<body>
  <main class="cadastro-container">
    <!-- Capa do site com a logo/imagem da Servix -->
    <aside class="cadastro-cover" aria-label="Capa Servix"
      style="background-image: url('img/51b134c0-a354-4dea-8a5d-c7e31a5b9e07_1617792012.jpeg');">
      <div class="cover-overlay">
        <img src="Projeto-servix/img/IMG-20260416-WA0658.jpg" alt="Logo da Servix" class="cover-icon">
        <h2>Servix</h2>
        <p>Encontre serviços com facilidade e segurança.</p>
      </div>
    </aside>
    
    <section class="cadastro-card">
      <div class="brand-area">
        <img src="Projeto-servix/img/IMG-20260416-WA0658.jpg" alt="Logo da Servix" class="brand-logo">
        <h1>Servix</h1>
      </div>
      <p class="cadastro-subtitulo">
        Crie a sua conta para encontrar serviços com facilidade
      </p>

      <!-- FORMULÁRIO DE CADASTRO -->
      <form class="cadastro-form" id="form-cadastro">
        
        <div class="form-group">
          <label for="nome">Nome Completo</label>
          <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
        </div>

        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" placeholder="Crie uma senha forte" minlength="6" required>
        </div>

        <button type="submit" class="btn-cadastro" id="btn-cadastrar">Criar Conta</button>
        
      </form>
      <!-- FIM DO FORMULÁRIO -->

      <p class="login-texto">
        Já tem uma conta?
        <a href="index.html">Entrar</a>
      </p>
    </section>
  </main>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/env-config.js"></script>
  <script type="module" src="JavaScript/main.js"></script>
</body>

</html>
