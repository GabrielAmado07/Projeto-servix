<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro Servix</title>
  <link rel="stylesheet" href="Css/Cadastro.css">
  <link rel="stylesheet" href="Css/modern-effects.css">
  <link rel="icon" type="image/jpeg" href="Projeto-servix/img/IMG-20260416-WA0658.jpg">
</head>

<body>
  <main class="cadastro-container">
    <!-- Capa do site com a logo/imagem da Servix -->
    <aside class="cadastro-cover" aria-label="Capa Servix"
      style="background-image: url('img/51b134c0-a354-4dea-8a5d-c7e31a5b9e07_1617792012.jpeg');">
      <div class="cover-overlay">
        <img src="Projeto-servix/img/IMG-20260416-WA0658.jpg" alt="Logo da Servix" class="cover-icon">
        <h2>Servix</h2>
        <p>Encontre serviços com facilidade e segurança.</p>
      </div>
    </aside>
    <section class="cadastro-card">
      <div class="brand-area">
        <img src="Projeto-servix/img/IMG-20260416-WA0658.jpg" alt="Logo da Servix" class="brand-logo">
        <h1>Servix</h1>
      </div>
      <p class="cadastro-subtitulo">
        Crie a sua conta para encontrar serviços com facilidade
      </p>

      <form id="form-cadastro" class="cadastro-form">
        <label>
          <span>Nome completo</span>
          <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>
        </label>

        <label>
          <span>E-mail</span>
          <input type="email" id="email" name="email" placeholder="seu@email.com" required>
        </label>

        <label>
          <span>CPF</span>
          <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" required>
        </label>

        <label>
          <span>Telefone</span>
          <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" maxlength="15" required>
        </label>

        <label>
          <span>Senha</span>
          <input type="password" id="senha" name="senha" placeholder="Mínimo 6 caracteres" minlength="6" required>
        </label>

        <button type="submit" class="btn-cadastro">
          Cadastrar
        </button>
      </form>

      <p class="login-texto">
        Já tem uma conta?
        <a href="Servix.html">Entrar</a>
      </p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/env-config.js"></script>
  <script src="JavaScript/main.js"></script>
</body>

</html>
