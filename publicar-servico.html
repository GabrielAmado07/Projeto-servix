<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publicar serviço - Servix</title>
    <link rel="stylesheet" href="Css/Cadastro.css">
    <link rel="stylesheet" href="Css/modern-effects.css">
    <link rel="icon" type="image/jpeg" href="img/Logo completa.jpeg">
</head>

<body>
    <main class="cadastro-container">
        <aside class="cadastro-cover" aria-label="Capa Servix"
            style="background-image: url('img/51b134c0-a354-4dea-8a5d-c7e31a5b9e07_1617792012.jpeg');">
            <div class="cover-overlay">
                <img src="img/Logo icone.jpeg" alt="Logo da Servix" class="cover-icon">
                <h2>Servix</h2>
                <p>Publique seu serviço e encontre novos clientes.</p>
            </div>
        </aside>

        <section class="cadastro-card">
            <div class="brand-area">
                <img src="img/Logo icone.jpeg" alt="Logo da Servix" class="brand-logo">
                <h1>Publicar serviço</h1>
            </div>
            <p class="cadastro-subtitulo">Adicione uma oferta ao marketplace usando sua conta.</p>

            <form class="cadastro-form" id="form-servico">
                <div class="form-group">
                    <label for="servico-titulo">Título do serviço</label>
                    <input type="text" id="servico-titulo" required placeholder="Ex.: Instalação elétrica residencial">
                </div>

                <div class="form-group">
                    <label for="servico-descricao">Descrição</label>
                    <textarea id="servico-descricao" rows="4" required placeholder="Explique o que você oferece"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="servico-categoria">Categoria</label>
                        <select id="servico-categoria" required>
                            <option value="">Carregando categorias...</option>
                        </select>
                        <button type="button" class="btn-link-categoria" id="mostrar-nova-categoria" aria-expanded="false" aria-controls="nova-categoria">+ Criar nova categoria</button>
                        <div class="nova-categoria" id="nova-categoria" hidden style="display: none;">
                            <label for="servico-nova-categoria">Nome da nova categoria</label>
                            <div class="nova-categoria-row">
                                <input type="text" id="servico-nova-categoria" maxlength="80" autocomplete="off" placeholder="Ex.: Jardinagem">
                                <button type="button" class="btn-confirmar-categoria" id="criar-categoria">Adicionar</button>
                            </div>
                            <p class="categoria-status" id="categoria-status" aria-live="polite"></p>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="servico-preco">Preço estimado</label>
                        <input type="number" id="servico-preco" min="0" step="0.01" required placeholder="150,00">
                    </div>
                </div>

                <div class="form-row service-location-row">
                    <div class="form-group">
                        <label for="servico-cep">CEP</label>
                        <input type="text" id="servico-cep" inputmode="numeric" maxlength="9" placeholder="00000-000" required>
                    </div>
                    <div class="form-group">
                        <label for="servico-cidade">Cidade</label>
                        <input type="text" id="servico-cidade" readonly required>
                    </div>
                    <div class="form-group">
                        <label for="servico-estado">Estado</label>
                        <input type="text" id="servico-estado" maxlength="2" readonly required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="servico-endereco">Endereço de atendimento</label>
                    <input type="text" id="servico-endereco" placeholder="Rua, número e complemento" required>
                </div>

                <div class="form-group">
                    <label for="servico-detalhe">Detalhe do preço</label>
                    <input type="text" id="servico-detalhe" placeholder="Ex.: valor por visita">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="servico-foto-arquivo">Foto do serviço</label>
                        <input type="file" id="servico-foto-arquivo" accept="image/*">
                        <input type="url" id="servico-foto" placeholder="ou cole uma URL da imagem">
                        <input type="hidden" id="servico-foto-atual-url">
                        <div class="foto-preview-wrapper" id="foto-preview-wrapper" hidden>
                            <img id="servico-foto-preview" alt="Pré-visualização da foto do serviço" class="servico-foto-preview">
                            <label class="remover-foto-toggle">
                                <input type="checkbox" id="servico-remover-foto">
                                Remover foto atual
                            </label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="servico-whatsapp">WhatsApp</label>
                        <input type="tel" id="servico-whatsapp" placeholder="(21) 99999-9999">
                    </div>
                </div>

                <button type="submit" class="btn-cadastro" id="btn-publicar">Publicar serviço</button>
            </form>

            <p class="login-texto"><a href="compras.html">Voltar ao marketplace</a></p>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="env-config.js"></script>
    <script src="JavaScript/main.js"></script>
</body>

</html>
